name = "artifactpassport-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "artifactpassport-artifacts"

[[d1_databases]]
binding = "DB"
database_name = "artifactpassport"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["17 * * * *"]

[vars]
APP_ORIGIN = "https://YOUR-DOMAIN.example"
MAX_SHARE_BYTES = "10485760"
SHARE_TTL_SECONDS = "86400"
